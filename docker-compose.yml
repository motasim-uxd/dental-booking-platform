services:
  postgres:
    image: postgres:16-alpine
    ports:
      # 5433 on host avoids conflict with a local Windows PostgreSQL on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
      POSTGRES_DB: dental_booking
    volumes:
      - dental_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  whisper:
    build:
      context: ./whisper-server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    restart: unless-stopped

  fastapi:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      FASTAPI_PORT: "8001"
      S2S_SHARED_SECRET: ${S2S_SHARED_SECRET:-dev-secret-change-me}
      # Use the docker network hostname, not localhost.
      DATABASE_URL: postgresql://dental:dental@postgres:5432/dental_booking
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  dental_pg_data:

